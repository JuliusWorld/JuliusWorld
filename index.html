
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JuliusWorld</title>

<!-- Schach-Regeln -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:white;font-family:Arial;text-align:center}
header{background:#17264b;padding:25px}
h1{color:#55baff;font-size:38px;margin:0}
nav{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;padding:20px}
button{cursor:pointer;border:0;border-radius:8px;padding:12px;background:#55baff;color:#071329;font-weight:bold}
button:hover{background:#a1d9ff}
.game{display:none;padding:15px}
.game.active{display:block}
.board{display:grid;justify-content:center;gap:5px;margin:20px auto}
.cell{width:75px;height:75px;font-size:35px}
#memoryBoard{grid-template-columns:repeat(6,60px)}
.memoryCard{width:60px;height:60px;font-size:25px}
#fourBoard{grid-template-columns:repeat(7,48px)}
.fourCell{width:48px;height:48px;border-radius:50%;padding:0;font-size:25px;background:#26375c;color:white}
#chessBoard{grid-template-columns:repeat(8,min(11vw,62px));gap:0}
.square{width:min(11vw,62px);height:min(11vw,62px);padding:0;border-radius:0;font-size:min(8vw,42px);color:#111}
.light{background:#f0d9b5}
.dark{background:#b58863}
.selected{outline:4px solid #00aaff;outline-offset:-4px}
</style>
</head>

<body>
<header>
<h1>🌍 JuliusWorld</h1>
<p>Deine Welt voller Spiele!</p>
</header>

<nav>
<button onclick="showGame('tic')">Tic-Tac-Toe</button>
<button onclick="showGame('four')">Vier gewinnt</button>
<button onclick="showGame('memory')">Memory</button>
<button onclick="showGame('chess')">Schach</button>
</nav>

<!-- TIC TAC TOE -->
<section id="tic" class="game active">
<h2>⭕ Tic-Tac-Toe ❌</h2>
<p id="ticInfo">X ist am Zug</p>
<div id="ticBoard" class="board" style="grid-template-columns:repeat(3,75px)"></div>
<button onclick="newTic()">Neustart</button>
</section>

<!-- VIER GEWINNT -->
<section id="four" class="game">
<h2>🔴 Vier gewinnt 🟡</h2>
<p id="fourInfo">Rot ist am Zug</p>
<div id="fourBoard" class="board"></div>
<button onclick="newFour()">Neustart</button>
</section>

<!-- MEMORY -->
<section id="memory" class="game">
<h2>🧠 Memory</h2>
<p id="memoryInfo">Finde alle 12 Paare!</p>
<div id="memoryBoard" class="board"></div>
<button onclick="newMemory()">Neustart</button>
</section>

<!-- SCHACH -->
<section id="chess" class="game">
<h2>♟️ Schach</h2>
<p id="chessInfo">Weiß ist am Zug</p>
<div id="chessBoard" class="board"></div>
<div id="promotion"></div>
<button onclick="undoChess()">Zug zurück</button>
<button onclick="newChess()">Neustart</button>
</section>

<script>
function showGame(id){
document.querySelectorAll('.game').forEach(g=>g.classList.remove('active'));
document.getElementById(id).classList.add('active');
}

// TIC TAC TOE
let ticCells=[],ticTurn='X',ticFinished=false;

function newTic(){
ticCells=Array(9).fill('');
ticTurn='X';
ticFinished=false;
drawTic();
}

function drawTic(){
const board=document.getElementById('ticBoard');
board.innerHTML='';
ticCells.forEach((value,i)=>{
const b=document.createElement('button');
b.className='cell';
b.textContent=value;
b.onclick=()=>playTic(i);
board.appendChild(b);
});
document.getElementById('ticInfo').textContent=
ticFinished?'Spiel beendet':ticTurn+' ist am Zug';
}

function playTic(i){
if(ticFinished||ticCells[i])return;
ticCells[i]=ticTurn;
const wins=[
[0,1,2],[3,4,5],[6,7,8],
[0,3,6],[1,4,7],[2,5,8],
[0,4,8],[2,4,6]
];
if(wins.some(line=>line.every(x=>ticCells[x]===ticTurn))){
ticFinished=true;
}else if(ticCells.every(Boolean)){
ticFinished=true;
}else{
ticTurn=ticTurn==='X'?'O':'X';
}
drawTic();
if(ticFinished){
document.getElementById('ticInfo').textContent=
wins.some(line=>line.every(x=>ticCells[x]===ticTurn))
?ticTurn+' hat gewonnen!':'Unentschieden!';
}
}

// VIER GEWINNT
let fourCells=[],fourTurn='R',fourFinished=false;

function newFour(){
fourCells=Array.from({length:6},()=>Array(7).fill(''));
fourTurn='R';
fourFinished=false;
drawFour();
}

function drawFour(){
const board=document.getElementById('fourBoard');
board.innerHTML='';
for(let r=0;r<6;r++){
for(let c=0;c<7;c++){
const b=document.createElement('button');
b.className='fourCell';
b.textContent=fourCells[r][c]==='R'?'🔴':
fourCells[r][c]==='Y'?'🟡':'';
b.onclick=()=>dropFour(c);
board.appendChild(b);
}
}
document.getElementById('fourInfo').textContent=
fourFinished?'Spiel beendet':(fourTurn==='R'?'Rot':'Gelb')+' ist am Zug';
}

function checkFour(r,c){
for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){
let count=1;
for(const sign of [-1,1]){
let rr=r+dr*sign,cc=c+dc*sign;
while(rr>=0&&rr<6&&cc>=0&&cc<7&&fourCells[rr][cc]===fourTurn){
count++;
rr+=dr*sign;cc+=dc*sign;
}
}
if(count>=4)return true;
}
return false;
}

function dropFour(c){
if(fourFinished)return;
let r=5;
while(r>=0&&fourCells[r][c]!=='')r--;
if(r<0)return;
fourCells[r][c]=fourTurn;
if(checkFour(r,c)){
fourFinished=true;
}else if(fourCells.every(row=>row.every(x=>x!==''))){
fourFinished=true;
}else{
fourTurn=fourTurn==='R'?'Y':'R';
}
drawFour();
if(fourFinished&&fourCells.some(row=>row.includes(fourTurn))){
document.getElementById('fourInfo').textContent=
(fourTurn==='R'?'Rot':'Gelb')+' hat gewonnen!';
}else if(fourFinished){
document.getElementById('fourInfo').textContent='Unentschieden!';
}
}

// MEMORY
const memorySymbols=['🐶','🐱','🐸','🦊','🐼','🐵',
'🦁','🐧','🐨','🐰','🐯','🐷'];

let memoryCards=[],memoryOpen=[],memoryFound=[];
let memoryLocked=false;

function newMemory(){
memoryCards=[...memorySymbols,...memorySymbols]
.sort(()=>Math.random()-.5);
memoryOpen=[];
memoryFound=[];
memoryLocked=false;
drawMemory();
}

function drawMemory(){
const board=document.getElementById('memoryBoard');
board.innerHTML='';
memoryCards.forEach((symbol,i)=>{
const b=document.createElement('button');
b.className='memoryCard';
b.textContent=memoryFound.includes(i)||memoryOpen.includes(i)?symbol:'?';
b.onclick=()=>flipMemory(i);
board.appendChild(b);
});
document.getElementById('memoryInfo').textContent=
'Gefundene Paare: '+memoryFound.length/2+'/12';
}

function flipMemory(i){
if(memoryLocked||memoryFound.includes(i)||memoryOpen.includes(i))return;
memoryOpen.push(i);
drawMemory();

if(memoryOpen.length===2){
if(memoryCards[memoryOpen[0]]===memoryCards[memoryOpen[1]]){
memoryFound.push(...memoryOpen);
memoryOpen=[];
drawMemory();
if(memoryFound.length===24){
document.getElementById('memoryInfo').textContent='Gewonnen! 🎉';
}
}else{
memoryLocked=true;
setTimeout(()=>{
memoryOpen=[];
memoryLocked=false;
drawMemory();
},900);
}
}
}

// SCHACH
let chessGame=null;
let chessSelected=null;
let chessHistory=[];

const pieces={
wK:'♔',wQ:'♕',wR:'♖',wB:'♗',wN:'♘',wP:'♙',
bK:'♚',bQ:'♛',bR:'♜',bB:'♝',bN:'♞',bP:'♟'
};

function newChess(){
if(typeof Chess==='undefined'){
document.getElementById('chessInfo').textContent=
'Schach konnte nicht geladen werden. Prüfe deine Internetverbindung.';
return;
}
chessGame=new Chess();
chessSelected=null;
chessHistory=[];
drawChess();
}

function drawChess(){
if(!chessGame)return;
const board=document.getElementById('chessBoard');
board.innerHTML='';
const position=chessGame.board();
const legal=chessGame.moves({verbose:true});

for(let r=0;r<8;r++){
for(let c=0;c<8;c++){
const square='abcdefgh'[c]+(8-r);
const piece=position[r][c];
const b=document.createElement('button');
b.className='square '+((r+c)%2?'dark':'light');
if(chessSelected===square)b.classList.add('selected');
b.textContent=piece?pieces[piece.color+piece.type.toUpperCase()]:'';
b.onclick=()=>clickChess(square);
board.appendChild(b);
}
}

let info='';
if(chessGame.in_checkmate()){
info='SCHACHMATT! '+(chessGame.turn()==='w'?'Schwarz':'Weiß')+' gewinnt!';
}else if(chessGame.in_stalemate()){
info='PATT! Unentschieden!';
}else if(chessGame.in_draw()){
info='Unentschieden!';
}else{
info=(chessGame.turn()==='w'?'Weiß':'Schwarz')+' ist am Zug';
if(chessGame.in_check())info+=' – SCHACH!';
}
document.getElementById('chessInfo').textContent=info;
}

function clickChess(square){
if(!chessGame||chessGame.game_over())return;
const piece=chessGame.get(square);

if(chessSelected){
const moves=chessGame.moves({square:chessSelected,verbose:true});
const possible=moves.find(m=>m.to===square);
if(possible){
let promotion='q';
if(possible.flags.includes('p')){
promotion=prompt('Bauer umwandeln? q=Dame, r=Turm, b=Läufer, n=Springer','q')||'q';
if(!['q','r','b','n'].includes(promotion))promotion='q';
}
chessHistory.push(chessGame.fen());
chessGame.move({from:chessSelected,to:square,promotion:promotion});
chessSelected=null;
drawChess();
return;
}
}

if(piece&&piece.color===chessGame.turn()){
chessSelected=square;
}else{
chessSelected=null;
}
drawChess();
}

function undoChess(){
if(!chessGame||chessHistory.length===0)return;
chessGame.load(chessHistory.pop());
chessSelected=null;
drawChess();
}

// START
newTic();
newFour();
newMemory();
newChess();
</script>
</body>
</html>
