
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JuliusWorld</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 20px;
      background: #080d20;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      text-align: center;
      padding: 30px 10px;
    }

    h1 {
      color: #38aaff;
      font-size: 45px;
      text-shadow: 0 0 15px #168cff;
    }

    header p {
      color: #b8c9e8;
    }

    h2 {
      text-align: center;
      color: #38aaff;
      margin-top: 40px;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 22px;
      max-width: 1200px;
      margin: 30px auto;
    }

    .video-card {
      background: #111b35;
      border: 1px solid #1976d2;
      border-radius: 15px;
      padding: 15px;
      box-shadow: 0 0 12px #102f60;
    }

    .video-card h3 {
      color: #55b8ff;
      margin-top: 0;
    }

    video {
      width: 100%;
      border-radius: 10px;
      background: black;
    }

    .empty {
      color: #9aaccb;
      text-align: center;
      padding: 25px 5px;
      border: 1px dashed #31527c;
      border-radius: 10px;
    }

    footer {
      text-align: center;
      color: #7185a8;
      margin-top: 50px;
    }
  </style>
</head>

<body>

  <header>
    <h1>JuliusWorld</h1>
    <p>Willkommen in meiner Welt!</p>
  </header>

  <h2>🎬 Videos</h2>

  <main class="video-grid">

    <div class="video-card">
      <h3>Video 1</h3>
